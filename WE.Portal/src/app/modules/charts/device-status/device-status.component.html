<div class="flex align-items-center h-5rem">
  <div class="flex col-6 justify-content-end">
    <img
    *ngIf="routerStatus === 'ONLINE'"
      src="assets/layout/images/Online_Vector.svg"
      class="h-6rem"
    />
    <img
      *ngIf="routerStatus === 'OFFLINE'"
      src="assets/layout/images/Off_Vector.svg"
      class="h-6rem w-6rem mt-3"
    />
  </div>
  <div class="col-6">
    <div
      class="flex justify-content-start font-medium mt-5"
      [ngClass]="routerStatus === 'ONLINE' ? 'text-green-500' : 'text-red-500'"
    >
      {{ routerStatus }}
    </div>
    <div *ngIf="uptime" class="flex justify-content-start font-normal text-sm mt-2">
      Uptime: {{ uptime }}
    </div>
  </div>
</div>
