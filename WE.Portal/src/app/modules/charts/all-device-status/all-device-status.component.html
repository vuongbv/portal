<div>
  <div (click)="onDeviceLayer()" class="flex align-items-center justify-content-around cursor-pointer">
    <p class="text-green-400 text-size-medium">{{ devicesOn }}</p>
    <p class="ml-2 text-size-small">Total Device Up</p>
  </div>
  <div (click)="offDeviceLayer()" class="flex align-items-center justify-content-around cursor-pointer">
    <p class="text-red-400 text-size-medium">{{ devicesOff }}</p>
    <p class="ml-2 text-size-small">Total Device Off</p>
  </div>
</div>
