<div *ngIf="weatherDetail" style="height: 100%;">
  <app-title-tooltip
    [title]="title"
    [description]="description"
    [widget_under_title_description] = "widget_under_title_description"
  ></app-title-tooltip>
  <div class="flex items-center">
    <div class="col-12 mb-2 lg:col-5 lg:mb-0 text-right">
      <img
        src="https:{{ weatherDetail.condition.icon }}"
        alt="Sakai logo"
        style="width: 50px"
      />
    </div>
    <div class="col-12 mb-4 lg:col-7 lg:mb-0">
      <div class="text-900 font-medium">{{ weatherDetail.condition.text }}</div>
      <div class="text-900 font-medium">{{ weatherDetail.temp_c }} C</div>
    </div>
  </div>
</div>
