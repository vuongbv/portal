<div class="card">
  <p-scrollPanel
    [style]="{ width: '100%', height: '300px' }"
    styleClass="custombar1"
  >
    <p-tree
      [value]="zones"
      selectionMode="checkbox"
      [styleClass]="'w-full'"
      [(selection)]="selectedZone"
      [filter]="true"
      filterPlaceholder="Device Filter"
    >
    </p-tree>
  </p-scrollPanel>
  <div class="flex justify-content-between align-items-center mb-3">
    <p-inputSwitch
      [(ngModel)]="status"
      trueValue="On"
      falseValue="Off"
    ></p-inputSwitch>
  </div>
  <div class="flex justify-content-between align-items-center mb-3">
    <label for="fromDate" class="blockfont-medium mb-2">From</label>
    <p-calendar
      class="ml-2"
      inputId="basic"
      [(ngModel)]="start_date"
      [minDate]="minDate"
      [readonlyInput]="true"
      appendTo="body"
      [dateFormat]="'dd/mm/yy'"
      [showTime]="true"
    ></p-calendar>
    <label for="endDate" class="block font-medium mb-2 ml-2">To</label>
    <p-calendar
      class="ml-2"
      [(ngModel)]="end_date"
      [readonlyInput]="true"
      [minDate]="start_date!"
      inputId="min-max"
      appendTo="body"
      [dateFormat]="'dd/mm/yy'"
      [showTime]="true"
    ></p-calendar>
  </div>
  <p-table
    *ngIf="commands.length > 0"
    [value]="commands"
    [paginator]="false"
    [rows]="10"
    [totalRecords]="commands.length"
    responsiveLayout="scroll"
    [scrollable]="true"
    scrollHeight="300px"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Device Name</th>
        <th>Command</th>
        <th>Execution time</th>
        <th>Command status</th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-data>
      <tr>
        <td>{{ data.device_name }}</td>
        <td>{{ data.command }}</td>
        <td>{{ data.execution_time | date : "dd-MM-yyyy HH:mm" }}</td>
        <td>{{ data.command_status }}</td>
        <td>
          <div class="flex">
            <button
              *ngIf="data.command_status === 'Processing'"
              pButton
              pRipple
              label="Cancel"
              class="p-2 font-medium p-button-secondary"
              type="button"
              (click)="cancelOperation(data.cno)"
            ></button>
            <button
              *ngIf="data.command_status === 'Processed'"
              pButton
              pRipple
              label="Revoke"
              class="p-2 font-medium p-button-secondary"
              type="button"
              (click)="cancelOperation(data.cno)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <button
    pButton
    pRipple
    label="Submit"
    class="p-2 font-medium"
    (click)="save()"
  ></button>
</div>
