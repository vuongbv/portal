<app-title-tooltip
  [title]="title"
  [description]="description" [date]="date"
  [widget_under_title_description] = "widget_under_title_description"
></app-title-tooltip>
<app-device-status [status]="operationStatus" [uptime] = "uptime"></app-device-status>
<div class="flex col-12 justify-content-end " style="margin-top: 3.5rem;">
  <span class="flex align-items-center justify-content-center">
    <i class="pi pi-clock"></i> <span class="ml-2  font-normal text-sm text-gray-400">Refreshes every {{data_frequency}} </span>
  </span>
  <!-- <span class="flex align-items-center justify-content-center text-900 h8">{{
    date | date : "dd-MM-yyyy HH:mm"
  }}</span> -->
</div>
