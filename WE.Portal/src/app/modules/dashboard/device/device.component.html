<div class="grid" *ngIf="tenant =='Watsons'">
  <div class="col-12 lg:col-12 xl:col-12">
    <p-selectButton [options]="optionsTime" [(ngModel)]="selectedTime"  optionLabel="name" optionValue="value" (onChange)="onTimeChange()"></p-selectButton>
  </div>
  
  <div class="col-12 lg:col-4 xl:col-4">
    <div class="card mb-4">
      <h5>Current Power Usage</h5>
      <div class="grid formgrid">
        <div class="col-12 mb-12 lg:col-12 lg:mb-2">
          <span class="h4">{{ data.total_power }}</span>
          <span class="subtitle-1"> W</span>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 lg:col-4 xl:col-4">
    <div class="card mb-4">
      <h5>voltage</h5>
      <div class="grid formgrid">
        <div class="col-12 mb-2 lg:col-4 lg:mb-2">
          <span class="h4">{{ data.avg_voltage }}</span>
          <span class="subtitle-1"> V</span>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12 lg:col-4 xl:col-4">
    <div class="card">
      <h5>Current</h5>
      <div class="grid formgrid">
        <div class="col-12 mb-2 lg:col-4 lg:mb-2">
          <span class="h4">{{ data.avg_current }}</span>
          <span class="subtitle-1"> A</span>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12 xl:col-6">
    <div class="card mb-2">
      <div class="flex justify-content-between flex-wrap">
        <h5>Energy Comsumption Trends</h5>
        <div class="flex justify-content-end flex-wrap">
          <p-dropdown
            [options]="optionsTime"
            [(ngModel)]="SelectTimeTrends"
            optionLabel="name"
            optionValue="value"
            (onChange)="onChangeTimeTrends()"
          ></p-dropdown>
        </div>
      </div>
      <app-line-chart
        [Series]="powerData"
        [catalogs]="powerDataCategories"
      ></app-line-chart>
    </div>
  </div>

  <div class="col-12 xl:col-6">
    <div class="card mb-2">
      <div class="flex justify-content-between flex-wrap">
        <h5>Comparison of Power Usage</h5>
        <div class="flex justify-content-end flex-wrap">
          <p-dropdown
            class="right-0"
            [options]="optionsTime"
            [(ngModel)]="SelectTimeCompare"
            optionLabel="name"
            optionValue="value"
            (onChange)="onChangeTimeCompare()"
          ></p-dropdown>
        </div>
      </div>

      <app-bar-chart
        [Series]="compagePowerData"
        [catalogs]="powerCompageCategories"
      ></app-bar-chart>
    </div>
  </div>
</div>
