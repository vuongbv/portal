<h5>Page Management</h5>
<p-button
            type="button"
            pRipple
            icon="pi pi-plus"
            class="p-button p-component p-button-text p-button-icon-only"
            (click)="addNew()"
          ></p-button>
<div class="card">
  <p-table
    [value]="panels"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="total"
    [lazy]="true"
    (onLazyLoad)="lazyLoadTabel($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th >Name</th>
       
        <th style="width: 10%">action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-panel>
      <tr>
        <td>{{ panel.panel_name }}</td>
        
        <td>
          <p-button
            type="button"
            pRipple
            icon="pi pi-pencil"
            styleClass="p-button-rounded p-button-text"
            (click)="edit(panel.id)"
          ></p-button>
          
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
