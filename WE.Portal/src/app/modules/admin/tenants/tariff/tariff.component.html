<div class="card">
  <h5>Tariff Setting</h5>
  <p-table
  [value]="tariffs"
  [paginator]="true"
  [rows]="6"
  [lazy]="true"
  [totalRecords]="total"
  [showCurrentPageReport]="true"
  (onLazyLoad)="loadTariff($event)"
  responsiveLayout="scroll"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
  
>
  <ng-template pTemplate="header">
    <tr>
      <th>Month - Year</th>
      <th>Value</th>     
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-tariff>
    <tr>
      <td>{{ tariff.date_time }}</td>
      <td>{{ tariff.value }}</td>
    </tr>
  </ng-template>
</p-table>
<h5>Tariff Current Month</h5>
  <form
    (ngSubmit)="tariffForm.form.valid && save()"
    #tariffForm="ngForm"
    novalidate
  >
    <div class="card p-fluid">
      <div class="field">
        <label htmlFor="value">Value</label>
        <p-inputNumber
          [(ngModel)]="value"
          mode="decimal"
          name="value"
          #mode_value="ngModel"
          [minFractionDigits]="2"
        ></p-inputNumber>

        <p-message
          severity="error"
          text="Value is required"
          *ngIf="
            (mode_value.touched || tariffForm.submitted) &&
            mode_value.invalid &&
            mode_value.hasError('required')
          "
        ></p-message>
      </div>
      <div class="field">
        <label htmlFor="unit">Unit</label>

        <input
          pInputText
          id="unit"
          #mo_unit="ngModel"
          name="unit"
          [(ngModel)]="unit"
          type="text"
          maxlength="50"
          required
        />
        <p-message
          severity="error"
          text="Unit is required"
          *ngIf="
            (mo_unit.touched || tariffForm.submitted) &&
            mo_unit.invalid &&
            mo_unit.hasError('required')
          "
        ></p-message>
      </div>
    </div>
    <div class="p-dialog-footer">
      <button
        pButton
        pRipple
        label="Save"
        class="mr-2 mb-2"
        type="submit"
      ></button>
    </div>
  </form>
</div>
