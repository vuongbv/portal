<div class="card">
  <h5>Tenants Management</h5>
  <p-button
    type="button"
    icon="pi pi-plus"
    styleClass="p-button-text"
    (click)="addNew()"
  ></p-button>
  <p-table
    [value]="tenants"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="total"
    [lazy]="true"
    (onLazyLoad)="lazyLoadTabel($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>URL</th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tenant>
      <tr>
        <td>{{ tenant.name }}</td>
        <td>{{ tenant.url }}</td>

        <td>
          <p-button
            type="button"
            pRipple
            icon="pi pi-pencil"
            class="p-button p-component p-button-text p-button-icon-only"
            (click)="edit(tenant.id)"
          ></p-button>
          <p-button
            type="button"
            pRipple
            icon="pi 
            pi-trash"
            class="p-button p-component p-button-text p-button-icon-only"
            (click)="delete(tenant.id)"
          ></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
