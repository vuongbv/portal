<h5>Api Key Generation</h5>

<div class="card">
  <p-button
    type="button"
    icon="pi pi-plus"
    styleClass="p-button-text"
    (click)="addNew()"
  ></p-button>
  <p-table
    [value]="keys"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="total"
    [lazy]="true"
    (onLazyLoad)="lazyLoadTabel($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Key</th>
        <th>Expiry time</th>
        <th>Scopes</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-key>
      <tr>
        <td>
          {{ key.key
          }}<button
            ngxClipboard
            pButton
            pRipple
            type="button"
            [cbContent]="key.key"
            class="p-button-raised p-button-text"
            icon="pi pi-copy"
          ></button>
        </td>
        <td>{{ key.expiry_time }}</td>
        <td>{{ key.scopes }}</td>
        <td>
          <div class="flex">
            <button
              pButton
              pRipple
              type="button"
              icon="pi pi-pencil"
              class="p-button-rounded p-button-text"
              (click)="edit(key.key)"
            ></button>
            <button
              pButton
              pRipple
              type="button"
              icon="pi pi-trash"
              class="p-button-rounded p-button-text p-button-danger"
              (click)="delete(key.key)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
