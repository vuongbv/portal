<div class="card">
  <h5>Alarm Rules</h5>
  <button
    pButton
    pRipple
    class="mr-2 mb-2"
    type="button"
    label="Add New"
    (click)="addNew()"
  ></button>

  <p-table
    [value]="DeviceSettings"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="total"
    [lazy]="true"
    (onLazyLoad)="lazyLoadTabel($event)"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Devices</th>
        <th>Device Name</th>
        <th>Criteria</th>
        <th>Value From</th>
        <th>Value To</th>
        <th>Value Equal</th>
        <th>Operator</th>
        <th>Actions List</th>
        <th [width]="120">Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.device }}</td>
        <td>{{ item.device_name }}</td>
        <td>{{ item.criteria }}</td>
        <td>{{ item.value_from }}</td>
        <td>{{ item.value_to }}</td>
        <td>{{ item.value_equal }}</td>
        <td>{{ item.operator }}</td>
        <p *ngFor="let action of item.actions">{{ action.type }}</p>

        <td>
          <div class="flex">
            <button
              pButton
              pRipple
              type="button"
              icon="pi pi-pencil"
              class="p-button-rounded p-button-text"
              (click)="edit(item.id)"
            ></button>
            <button
              pButton
              pRipple
              type="button"
              icon="pi pi-trash"
              class="p-button-rounded p-button-text p-button-danger"
              (click)="delete(item.id)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-confirmDialog [style]="{width: '50vw'}"></p-confirmDialog>
</div>
