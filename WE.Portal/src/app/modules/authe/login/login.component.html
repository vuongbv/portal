<div
  class="surface-0 flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="grid justify-content-center p-2 lg:p-0" style="min-width: 80%">
    <!-- <div class="col-12 mt-5 xl:mt-0 text-center">
            <img src="assets/layout/images/.svg" alt=" logo" class="mb-5" style="width:81px; height:60px;">                
        </div> -->
    <div
      class="col-12 xl:col-6"
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
      *ngIf="!isNusUser"
    >
      <div
        class="h-full w-full m-0 py-7 px-4"
        style="
          border-radius: 53px;
          background: linear-gradient(
            180deg,
            var(--surface-50) 38.9%,
            var(--surface-0)
          );
        "
      >
        <div class="text-center mb-5">
          <span class="text-600 font-medium">Sign in to continue</span>
        </div>
        <form
          (ngSubmit)="loginForm.form.valid && signIn()"
          #loginForm="ngForm"
          novalidate
        >
          <div class="w-full md:w-10 mx-auto">
            <ng-container *ngIf="!isNusUser">
              <label
                for="email1"
                class="block text-900 text-xl font-medium mb-2"
                >Email</label
              >
              <input
                id="email1"
                type="text"
                name="email"
                placeholder="Email address"
                #email="ngModel"
                [(ngModel)]="identifier"
                pInputText
                class="w-full mb-3"
                style="padding: 1rem"
                required
                [disabled]="isNusUser"
              />
              <p-message
                severity="error"
                text="Email is required"
                *ngIf="
                  (email.touched || loginForm.submitted) &&
                  email.invalid &&
                  email.hasError('required')
                "
              ></p-message>
              <p-message
                severity="error"
                text="Email is valid"
                *ngIf="
                  (email.touched || loginForm.submitted) &&
                  email.invalid &&
                  email.hasError('email')
                "
              ></p-message>
              <label
                for="password1"
                class="block text-900 font-medium text-xl mb-2"
                >Password</label
              >
              <p-password
                id="password1"
                name="password"
                [(ngModel)]="password"
                placeholder="Password"
                [toggleMask]="true"
                styleClass="w-full mb-3"
                #txtPassword="ngModel"
                required
                [disabled]="isNusUser"
              ></p-password>
              <p-message
                severity="error"
                text="password is required"
                *ngIf="
                  (email.touched || loginForm.submitted) &&
                  txtPassword.invalid &&
                  txtPassword.hasError('required')
                "
              ></p-message>
              <div class="flex align-items-center justify-content-between mb-5">
                <!-- <div class="flex align-items-center">
                            <p-checkbox id="rememberme1" [binary]="true" styleClass="mr-2"></p-checkbox>
                            <label for="rememberme1">Remember me</label>
                        </div> -->
                <a
                  class="font-medium no-underline ml-2 text-right cursor-pointer"
                  style="color: var(--primary-color)"
                  >Forgot password?</a
                >
              </div>
            </ng-container>
            <button
              *ngIf="!isNusUser"
              pButton
              pRipple
              label="Sign In"
              class="w-full p-3 text-xl"
              type="submit"
            ></button>
            <button
              *ngIf="!isWatson"
              pButton
              pRipple
              label="Sign in"
              (click)="onLoginMicrosoft()"
              class="w-full p-3 text-xl mt-5"
              type="button"
            ></button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
