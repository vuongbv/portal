apiVersion : apps/v1
kind: Deployment
metadata:
  name: weportal
  namespace: weportal
  labels:
    app: weportal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weportal
  template:
    metadata:
      labels:
        app: weportal
    spec:     
      containers:
        - name: weportal 
          image: acrwedev111.azurecr.io/weportal:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: weportal-config
            # - secretRef:
            #    name: share-services-secrets
          #resources:
          #  requests:
          #    cpu: "1"
          #    memory: "1500Mi"
          #  limits:
          #    cpu: "1.5"
          #    memory: "4096Mi"
          # args:
          #   - /server
          # livenessProbe:
          #   httpGet:
          #     path: /healthcheck
          #     port: 80
          #   initialDelaySeconds: 10
          #   periodSeconds: 30
          #   failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
    name: weportal
    namespace: weportal
spec:
    type: ClusterIP
    ports:
    - port: 80 
      protocol: TCP
      targetPort: 80
    selector:
        app: weportal
#kind: Service
#apiVersion: v1
#metadata:
