---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 name: weportal-ingress
 namespace: weportal
 annotations:
   nginx.ingress.kubernetes.io/use-regex: "true"
   kubernetes.io/ingress.class: nginx
spec:
 rules:
   - host: 
     http:
      paths:
        - path: /(.*)
          pathType: Prefix
          backend:
            service:
              name: weportal
              port:
                number: 80
status:
  loadBalancer:
    ingress:
      - ip: 20.205.254.51
